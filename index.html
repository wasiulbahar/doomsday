<style>
:root {
  --paper:#f7f2e6; --paper-2:#efe7d3; --card:#fffdf7; --ink:#141714; --ink-2:#4f554f; --line:#141714; --shade:#141714; --soft:rgba(20,23,20,.12);
  --green:#006a4e; --on-green:#fff; --red:#d42a33; --dark:#0f1a15; --on-dark:#f3eee2; --on-dark-2:#b8bdb2; --yellow:#ffd23f;
  --font:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --gutter:clamp(18px,4vw,40px);
  --ease:cubic-bezier(.2,.7,.1,1); color-scheme:light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper:#111613; --paper-2:#18201b; --card:#19221d; --ink:#f1ece0; --ink-2:#b9bcb1; --line:#f1ece0; --shade:#000; --soft:rgba(241,236,224,.14); --green:#13916a; --dark:#0a110d; color-scheme:dark; } }
:root[data-theme="dark"] { --paper:#111613; --paper-2:#18201b; --card:#19221d; --ink:#f1ece0; --ink-2:#b9bcb1; --line:#f1ece0; --shade:#000; --soft:rgba(241,236,224,.14); --green:#13916a; --dark:#0a110d; color-scheme:dark; }

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1.0625rem/1.6 var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit} h1,h2,h3,p,ul,ol{margin:0} ul,ol{padding:0;list-style:none}
h1,h2,h3{font-weight:800;letter-spacing:-.03em;line-height:1.05}
:focus-visible{outline:3px solid var(--red);outline-offset:3px}
.wrap{max-width:860px;margin:0 auto;padding:0 var(--gutter)}
[hidden]{display:none!important}
.mark{display:inline-block;background:var(--red);color:#fff;padding:0 .16em .05em;border:2.5px solid #000;border-radius:8px;box-shadow:4px 4px 0 #000;transform:rotate(-1.5deg)}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 18px;border:2px solid currentColor;border-radius:999px;font:600 .98rem/1 var(--font);text-decoration:none;background:transparent;color:inherit;cursor:pointer;transition:background .2s,transform .2s var(--ease)}
.pill:hover{background:var(--soft);transform:translateY(-2px)}
.hero .pill:hover{background:rgba(243,238,226,.1)}
.tag{display:inline-block;font-size:.75rem;font-weight:800;padding:2px 10px;border-radius:999px;background:var(--red);color:#fff;vertical-align:3px;margin-left:6px;letter-spacing:.02em}

/* top */
.notice{background:var(--yellow);color:#141714;text-align:center;font-weight:600;font-size:.85rem;padding:5px 12px}
.nav{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--soft)}
.nav-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:60px;max-width:1080px}
.brand{text-decoration:none;display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.1rem;letter-spacing:-.02em}
.brand img{width:32px;height:32px}
.icon-btn{display:grid;place-items:center;width:40px;height:40px;border:1.5px solid var(--soft);border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;font-size:1.05rem}
.icon-btn:hover{background:var(--soft)}

/* hero */
.hero{background:var(--dark);color:var(--on-dark);padding:clamp(48px,8vw,88px) 0 clamp(52px,8vw,80px);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-20%;bottom:-70%;width:70vw;height:70vw;max-width:800px;max-height:800px;border-radius:50%;background:radial-gradient(circle,rgba(212,42,51,.28),transparent 65%);pointer-events:none}
.hero .wrap{position:relative;z-index:1}
.kick{font-weight:700;font-size:.95rem;color:var(--on-dark-2)}
.hero h1{font-size:clamp(2.3rem,1.3rem + 4.4vw,4.4rem);margin:12px 0 0}
.next{margin-top:clamp(40px,6vw,56px)}
.next-lbl{font-size:1rem;color:var(--on-dark-2)}
.next-lbl a{color:var(--on-dark);font-weight:700;text-underline-offset:4px}
.count{display:flex;gap:clamp(14px,4vw,36px);margin-top:12px}
.count .num{display:block;font-size:clamp(2.6rem,1.4rem + 5.5vw,4.8rem);font-weight:800;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.count div:first-child .num{color:var(--yellow)}
.count small{display:block;font-size:.85rem;color:var(--on-dark-2);margin-top:4px}
.num.tick{animation:tick .35s var(--ease)}
@keyframes tick{from{transform:translateY(-30%);opacity:0}to{transform:none;opacity:1}}
.quip{margin-top:20px;color:var(--on-dark-2)}
.today{margin-top:14px;font-size:clamp(1.6rem,1.2rem + 2vw,2.4rem);font-weight:800;letter-spacing:-.02em;color:var(--yellow)}
.exam p .dow{color:var(--ink);font-weight:700}

/* progress road */
.road{display:flex;justify-content:space-between;position:relative;margin-top:clamp(40px,6vw,56px);max-width:520px}
.road::before{content:"";position:absolute;left:26px;right:26px;top:19px;border-top:2px dashed rgba(243,238,226,.28)}
.stop{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-decoration:none;font-size:.8rem;font-weight:700;color:var(--on-dark-2);width:56px;text-align:center}
.stop i{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;background:var(--dark);border:2px solid rgba(243,238,226,.4);font-style:normal;font-size:.95rem;color:var(--on-dark);transition:transform .2s var(--ease)}
.stop:hover i{transform:scale(1.12)}
.stop.done i{background:var(--green);border-color:var(--green)}
.stop.now i{background:var(--red);border-color:var(--red);animation:pulse 2s infinite}
.stop.now{color:var(--on-dark)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(212,42,51,.6)}70%{box-shadow:0 0 0 12px rgba(212,42,51,0)}100%{box-shadow:0 0 0 0 rgba(212,42,51,0)}}
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:40px}

/* routine */
.sec{padding:clamp(56px,8vw,96px) 0}
.sec h2{font-size:clamp(1.9rem,1.4rem + 2vw,2.7rem)}
.sub-h{color:var(--ink-2);margin-top:8px;font-size:1.05rem}
.list{margin-top:32px}
.exam{display:grid;grid-template-columns:68px 1fr auto;align-items:center;gap:20px;padding:18px 20px;background:var(--card);border:2px solid var(--soft);border-radius:18px;text-decoration:none;color:var(--ink);transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
.exam:hover{transform:translate(-2px,-2px);border-color:var(--line);box-shadow:5px 5px 0 var(--shade)}
.exam.is-next{border-color:var(--line);box-shadow:5px 5px 0 var(--red)}
.exam.done{opacity:.5}
.date{text-align:center;border-radius:14px;background:var(--c);color:#fff;padding:7px 0 8px;line-height:1.1}
.date b{display:block;font-size:1.9rem;letter-spacing:-.04em;margin:1px 0}
.date span{display:block}
.date span{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.9}
.exam h3{font-size:clamp(1.15rem,1rem + .7vw,1.4rem);letter-spacing:-.02em;font-weight:700;line-height:1.2}
.exam p{color:var(--ink-2);font-size:.95rem;margin-top:4px}
.arrow{font-size:1.3rem;color:var(--ink-2);transition:transform .25s var(--ease)}
.exam:hover .arrow{transform:translateX(4px);color:var(--ink)}
.gap{padding:12px 0 12px 54px;font-size:.92rem;color:var(--ink-2);position:relative}
.gap::before{content:"";position:absolute;left:53px;top:0;bottom:0;border-left:2px dotted var(--ink-2);opacity:.4}
.gap span{position:relative;left:18px}
.gap.tight span{color:var(--red);font-weight:700}

/* course page */
.dhero{background:var(--c);color:#fff;padding:clamp(28px,5vw,48px) 0 clamp(40px,6vw,60px)}
.back{color:#fff;font-weight:600;text-decoration:none;opacity:.9}
.back:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
.dhero h1{font-size:clamp(2rem,1.2rem + 3.8vw,3.6rem);margin:22px 0 14px;max-width:20ch}
.dhero h1 a{text-decoration:none}
.dhero h1 a:hover{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.dhero .when{font-size:clamp(1.1rem,1rem + .5vw,1.3rem);font-weight:600}
.dhero .more{opacity:.88;margin-top:4px}
.left{display:inline-flex;align-items:baseline;flex-wrap:wrap;gap:2px;margin-top:22px;background:rgba(0,0,0,.22);padding:10px 16px;border-radius:14px;font-weight:600}
.left .num{font-size:1.5rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin-left:2px}
.left small{margin-right:8px;opacity:.85}
.sec h2.sm{font-size:clamp(1.5rem,1.2rem + 1.2vw,2rem)}
.mats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:20px}
.mat{display:flex;flex-direction:column;gap:6px;padding:18px;border-radius:18px;background:var(--card);border:2px solid var(--soft);text-decoration:none;color:var(--ink);transition:transform .2s var(--ease),box-shadow .2s var(--ease),border-color .2s}
a.mat:hover{transform:translate(-2px,-2px);border-color:var(--line);box-shadow:5px 5px 0 var(--shade)}
.mat .ic{font-size:1.7rem;line-height:1}
.mat b{font-size:1.08rem;letter-spacing:-.01em}
.mat small{color:var(--ink-2);font-size:.85rem}
.mat.off{opacity:.45}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.syl{margin-top:56px}
.syl-h{display:flex;justify-content:space-between;align-items:end;gap:8px 16px;flex-wrap:wrap}
.prog{font-weight:700;color:var(--ink-2)}
.hint{color:var(--ink-2);font-size:.92rem}
.bar{height:8px;border-radius:999px;background:var(--soft);margin:14px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:999px;transition:width .5s var(--ease)}
.ch{display:flex;gap:16px;align-items:flex-start;padding:16px 4px;border-bottom:1px solid var(--soft)}
.ch input{appearance:none;width:24px;height:24px;flex:none;margin:2px 0 0;border:2px solid var(--ink-2);border-radius:7px;background:transparent;display:grid;place-items:center;cursor:pointer;transition:background .2s,border-color .2s}
.ch input:checked{background:var(--green);border-color:var(--green)}
.ch input:checked::after{content:"✓";color:#fff;font-weight:800;font-size:.9rem}
.ch .t{font-size:1.06rem;font-weight:600;line-height:1.4;text-decoration:none}
.ch a.t:hover{color:var(--green);text-decoration:underline;text-underline-offset:4px}
.ch .meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:4px;font-size:.88rem;color:var(--ink-2)}
.ch .meta a{color:var(--green);font-weight:600;text-underline-offset:3px}
.ch:has(input:checked) .t{text-decoration:line-through;text-decoration-thickness:2px;color:var(--ink-2)}
.divider{margin:30px 0 2px;font-weight:800;font-size:.95rem;color:var(--red)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:56px}
.pn a{padding:16px 18px;border-radius:16px;border:2px solid var(--soft);text-decoration:none;transition:border-color .2s}
.pn a:hover{border-color:var(--line)}
.pn small{display:block;color:var(--ink-2);font-size:.82rem}
.pn b{font-weight:700}
.pn .r{text-align:right;grid-column:2}

#viewer{width:min(1000px,96vw);height:min(92vh,1100px);padding:0;overflow:hidden;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:18px}
#viewer[open]{display:flex;flex-direction:column}
#viewer::backdrop{background:rgba(10,15,12,.7)}
.vbar{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--soft)}
.vbar h3{flex:1;font-size:1.02rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vbar .pill{min-height:38px;padding:0 14px;font-size:.9rem}
#viewer iframe{flex:1;border:0;width:100%;background:#fff}

footer{color:var(--ink-2);padding:8px 0 56px;font-size:.92rem;text-align:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:999px;font-weight:700;z-index:99}
.view{animation:in .45s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:640px){
  .exam{grid-template-columns:56px 1fr;gap:14px;padding:14px 16px}
  .arrow{display:none}
  .date b{font-size:1.6rem}
  .gap{padding-left:44px}.gap::before{left:43px}
  .stop{width:48px;font-size:.72rem}
  .pn{grid-template-columns:1fr}.pn .r{grid-column:1}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header class="nav"><div class="wrap nav-in">
  <a class="brand" href="#"><img src="https://wasiulbahar.com/favicon.svg" alt="">Doomsday</a>
  <button class="icon-btn" id="theme" aria-label="Toggle dark mode">◐</button>
</div></header>
<main id="app"><div class="wrap sec">Loading the routine…</div></main>
<dialog id="viewer">
  <div class="vbar"><h3></h3><a class="pill open" target="_blank" rel="noopener">Open in Drive ↗</a><button class="icon-btn" onclick="this.closest('dialog').close()" aria-label="Close">✕</button></div>
  <iframe title="Document preview" allow="autoplay"></iframe>
</dialog>
<footer><div class="wrap">Made for the batch by <a href="https://wasiulbahar.com">Wasiul Bahar</a> · Good luck, you'll survive 🫡</div></footer>

<script>
const SHEET = '1cHUDhZ4e0HkL0mP-bdbcPEzczFKRam1uMuoO7k9-iWw';
// exam dates come from the sheet; only the short labels live here
const SHORT = {
  'Financial Statement Analysis and Valuation': 'FSAV', 'Financial Technology': 'FinTech',
  'Corporate Finance': 'CF', 'Public Finance': 'PF', 'Banking and Insurance': 'B&I',
};
const EXAM_HOUR = 9, EXAM_LEN = 3; // every exam starts at 9:00 am (Dhaka); ~3 h long
const MONTHS = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
// "30 November, 2026" / "November 30, 2026" / "30/11/2026" -> Date at 00:00 Dhaka, else null
function parseDate(t) {
  let d, m, y, x;
  if ((x = t.match(/^(\d{1,2})(?:st|nd|rd|th)?\s+([a-z]+)\.?,?\s+(\d{4})$/i))) [, d, m, y] = x;
  else if ((x = t.match(/^([a-z]+)\.?\s+(\d{1,2})(?:st|nd|rd|th)?,?\s+(\d{4})$/i))) [, m, d, y] = x;
  else if ((x = t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{4})$/))) { [, d, m, y] = x; m = +m; }
  else return null;
  if (typeof m === 'string') m = MONTHS.indexOf(m.slice(0, 3).toLowerCase()) + 1;
  if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
  return new Date(`${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}T00:00:00+06:00`);
}
const COLORS = ['#006a4e','#d42a33','#2f5bd3','#c26a00','#6b3fa0','#0f7d7d'];
const $ = s => document.querySelector(s);
const slug = s => s.toLowerCase().replace(/&/g,'and').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAY = 864e5;
let exams = [], timer;

// theme toggle (per-viewer convenience)
try { const t = localStorage.getItem('dd-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
$('#theme').onclick = () => {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  const cur = document.documentElement.dataset.theme || (dark ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('dd-theme', next); } catch {}
};

// The sheet's HTML view carries text AND the hyperlinks (gviz/CSV drop links).
// credentials:'omit' so a signed-in Google account in the student's browser can't interfere.
async function loadSheet() {
  const res = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET}/htmlview/sheet?headers=true&gid=0`, {credentials: 'omit', cache: 'no-store'});
  if (!res.ok) throw new Error('sheet ' + res.status);
  const table = new DOMParser().parseFromString(await res.text(), 'text/html').querySelector('table');
  if (!table) throw new Error('no table in sheet view');
  // lay merged cells out on a grid; a merged cell sits only at its top-left slot
  const grid = [], taken = [];
  [...table.querySelectorAll('tr')].filter(tr => tr.querySelector('td')).forEach((tr, r) => {
    grid[r] = grid[r] || []; taken[r] = taken[r] || [];
    let c = 0;
    for (const td of tr.querySelectorAll('td')) {
      while (taken[r][c]) c++;
      const rs = +td.rowSpan || 1, cs = +td.colSpan || 1, a = td.querySelector('a[href]');
      grid[r][c] = {t: td.textContent.trim(), u: a ? unwrap(a.getAttribute('href')) : ''};
      for (let i = 0; i < rs; i++) for (let j = 0; j < cs; j++) { (taken[r+i] = taken[r+i] || [])[c+j] = true; }
      c += cs;
    }
  });
  return grid;
}
function unwrap(h) { // google.com/url?q=REAL -> REAL
  try { const u = new URL(h, 'https://www.google.com'); return u.hostname.endsWith('google.com') && u.pathname === '/url' ? u.searchParams.get('q') : u.href; } catch { return ''; }
}

let master = '';
function parse(grid) {
  const get = (row, i) => (row && row[i]) || {t: '', u: ''};
  // find columns by header text, so inserted/moved columns in the sheet don't break the page
  const findCol = re => { for (const row of grid.slice(0, 6)) for (let i = 0; i < (row || []).length; i++) if (re.test(get(row, i).t)) return i; return -1; };
  const C = Math.max(0, findCol(/^course/i)), N = findCol(/chapter name/i) >= 0 ? findCol(/chapter name/i) : C + 3;
  const mc = findCol(/master folder/i); if (mc >= 0) for (const row of grid.slice(0, 6)) if (/master folder/i.test(get(row, mc).t)) master = get(row, mc).u;
  const out = []; let cur;
  for (const row of grid) {
    const v = i => get(row, i);
    if (v(C).t && !/^course/i.test(v(C).t)) {
      cur = {name: v(C).t, folder: v(C).u, chapters: [], date: null}; out.push(cur);
      // exam date: any date-looking cell on the course's first row
      for (let i = 0; i < (row || []).length && !cur.date; i++) if (i !== C) cur.date = parseDate(v(i).t);
    }
    if (!cur) continue;
    // cells right of the chapter name: materials (BOOK / Note / Comprehensive) and CFA chapter links
    let cfa = '';
    for (let i = N + 1; i < (row || []).length; i++) {
      const m = v(i), k = m.t.toLowerCase();
      if (k === 'book' && !cur.book) cur.book = m.u || '';
      if (k === 'note' && !cur.note) cur.note = m.u || '';
      if (k === 'comprehensive' && !cur.comp) cur.comp = m.u || '';
      if (/^cfa\b/.test(k) && m.u) cfa = m.u;
    }
    const name = v(N).t;
    if (!name || /chapter name/i.test(name)) continue;
    if (!v(C + 1).t) cur.chapters.push({sub: name}); // divider row like "Supporting Resources"
    else cur.chapters.push({n: v(C + 1).t, book: v(C + 2).t, bookUrl: v(C + 2).u || v(C + 1).u, cfaUrl: cfa, name, url: v(N).u});
  }
  return out.filter(c => c.chapters.some(x => x.n));
}

function build(courses) {
  // courses without a date go last and show "date not announced"
  exams = courses.map(c => ({...c, short: SHORT[c.name] || c.name.split(/\s+/).map(w => w[0]).join('').toUpperCase(),
    id: slug(c.name), tba: !c.date, at: c.date ? new Date(+c.date + EXAM_HOUR * 36e5) : new Date('2999-01-01T00:00:00+06:00')}))
    .sort((a, b) => a.at - b.at);
  exams.forEach((e, i) => { e.color = COLORS[i % COLORS.length]; e.prev = exams[i-1]; e.next = exams[i+1];
    e.gap = e.prev && !e.tba && !e.prev.tba ? Math.round((e.at - e.prev.at) / DAY) : null; });
}
const startOfDay = d => new Date(d.toLocaleDateString('en-CA', {timeZone:'Asia/Dhaka'}) + 'T00:00:00+06:00');
const fmt = (d, o) => d.toLocaleString('en-GB', {timeZone:'Asia/Dhaka', ...o});
const time = d => fmt(d, {hour:'numeric', minute:'2-digit', hour12:true});
const longDate = e => e.tba ? 'Date not announced yet' : `${fmt(e.at, {weekday:'long', day:'numeric', month:'long', year:'numeric'})} · ${time(e.at)}`;
const isDone = e => !e.tba && Date.now() >= +e.at + EXAM_LEN * 36e5;   // exam is over
const isToday = e => !e.tba && Date.now() >= +e.at && !isDone(e);      // exam is happening now
const upcoming = () => exams.find(e => !e.tba && !isDone(e));
const gapText = g => g <= 1 ? '😮‍💨 Back to back, no break' : g === 2 ? '☕ 1 free day in between' : `🌿 ${g - 1} free days in between`;
const daysTo = e => Math.round((startOfDay(e.at) - startOfDay(new Date())) / DAY);
const whenLeft = e => e.tba ? 'Date to be announced' : isDone(e) ? 'Done ✓' : isToday(e) ? 'Happening now. Good luck 🍀' : daysTo(e) === 0 ? 'Today' : daysTo(e) === 1 ? 'Tomorrow' : `in ${daysTo(e)} days`;
const QUIPS = ['One chapter at a time.', 'Coffee is a study material.', 'Future you says thanks.', 'Small steps still count.', 'You have done harder things.'];
const chCount = e => e.chapters.filter(c => c.n).length;
function startClock(target) {
  clearInterval(timer);
  const last = {};
  const tick = () => {
    let s = Math.max(0, Math.floor((target - Date.now()) / 1000));
    const v = {days: Math.floor(s/86400), hours: Math.floor(s%86400/3600), mins: Math.floor(s%3600/60), secs: s%60};
    document.querySelectorAll('.num[data-u]').forEach(el => {
      const u = el.dataset.u, t = String(v[u]).padStart(2, '0');
      if (el.textContent !== t) { el.textContent = t; if (last[u] !== undefined) { el.classList.remove('tick'); void el.offsetWidth; el.classList.add('tick'); } }
      last[u] = t;
    });
    if (s === 0) route();
  };
  tick(); timer = setInterval(tick, 1000);
}

function home() {
  const nx = upcoming(), dated = exams.filter(e => !e.tba);
  const units = [['days','days'],['hours','hrs'],['mins','min'],['secs','sec']];
  const range = dated.length ? ` · ${fmt(dated[0].at,{day:'numeric',month:'short'})} – ${fmt(dated.at(-1).at,{day:'numeric',month:'short'})}` : '';
  $('#app').innerHTML = `<div class="view">
  <section class="hero"><div class="wrap">
    <p class="kick">3.2${range}</p>
    <h1>Final exam <span class="mark">routine &amp; syllabus</span></h1>
    ${nx ? `<div class="next">
      <p class="next-lbl">Next up: <a href="#${nx.id}">${esc(nx.name)}</a> · ${fmt(nx.at,{weekday:'long', day:'numeric', month:'long'})}, ${time(nx.at)}</p>
      ${isToday(nx) ? `<p class="today">Exam in progress. Good luck! 🍀</p>`
      : `<div class="count">${units.map(([u, l]) => `<div><span class="num" data-u="${u}">--</span><small>${l}</small></div>`).join('')}</div>
      <p class="quip">${QUIPS[Math.floor(Math.random() * QUIPS.length)]}</p>`}</div>`
    : dated.length === exams.length ? `<div class="next"><p class="today">All exams done. You survived 🎉</p></div>` : ''}
    <nav class="road" aria-label="Exam progress">${exams.map((e, i) => `<a class="stop ${isDone(e) ? 'done' : e === nx ? 'now' : ''}" href="#${e.id}" title="${esc(e.name)}"><i>${isDone(e) ? '✓' : i + 1}</i>${esc(e.short)}</a>`).join('')}</nav>
    <div class="links"><button class="pill" id="ics">📅 Add all to calendar</button>
      ${master ? `<a class="pill" href="${esc(master)}" target="_blank" rel="noopener">📂 Master folder</a>` : ''}</div>
  </div></section>
  <section class="sec" id="routine"><div class="wrap">
    <h2>The routine</h2>
    <p class="sub-h">Tap a course for its syllabus, chapter PDFs, books and notes.</p>
    <div class="list">${exams.map(e => `
      ${e.gap != null ? `<div class="gap ${e.gap <= 1 ? 'tight' : ''}"><span>${gapText(e.gap)}</span></div>` : ''}
      <a class="exam ${e === nx ? 'is-next' : ''} ${isDone(e) ? 'done' : ''}" href="#${e.id}" style="--c:${e.color}">
        <div class="date">${e.tba ? '<b>?</b><span>TBA</span>' : `<span>${fmt(e.at,{weekday:'short'})}</span><b>${fmt(e.at,{day:'numeric'})}</b><span>${fmt(e.at,{month:'short'})}</span>`}</div>
        <div><h3>${esc(e.name)}${e === nx ? '<span class="tag">Next</span>' : ''}</h3>
          <p>${e.tba ? '' : `<b class="dow">${fmt(e.at,{weekday:'long'})}</b>, ${time(e.at)} · `}${whenLeft(e)}${studied(e)}</p></div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>`).join('')}</div>
  </div></section></div>`;
  $('#ics').onclick = () => ics(exams);
  if (nx && !isToday(nx)) startClock(nx.at);
}

const doneKey = e => 'dd-done-' + e.id;
function getDone(e) { try { return JSON.parse(localStorage.getItem(doneKey(e))) || []; } catch { return []; } }
function studied(e) { const d = getDone(e).length; return d ? ` · ${d}/${chCount(e)} studied` : ''; }

function detail(e) {
  const total = chCount(e);
  const gapLine = e.gap == null ? (e.prev ? '' : ' · The first exam') : ' · ' + (e.gap <= 1 ? `Right after ${esc(e.prev.short)}, no break` : `${e.gap - 1} free day${e.gap === 2 ? '' : 's'} after ${esc(e.prev.short)}`);
  $('#app').innerHTML = `<div class="view">
  <section class="dhero" style="--c:${e.color}"><div class="wrap">
    <a class="back" href="#">← All exams</a>
    <h1>${e.folder ? `<a href="${esc(e.folder)}" target="_blank" rel="noopener" title="Open the full course folder">${esc(e.name)}</a>` : esc(e.name)}</h1>
    <p class="when">${longDate(e)}</p>
    <p class="more">Exam ${exams.indexOf(e)+1} of ${exams.length}${gapLine}</p>
    ${e.tba ? '' : isDone(e) || isToday(e) ? `<div class="left">${whenLeft(e)}</div>`
      : `<div class="left">⏳ ${[['days','d'],['hours','h'],['mins','m'],['secs','s']].map(([u, l]) => `<span class="num" data-u="${u}">--</span><small>${l}</small>`).join('')} left</div>`}
  </div></section>
  <section class="sec"><div class="wrap">
    <h2 class="sm">Study materials</h2>
    <div class="mats">
      ${mat(e.book, '📘', 'Book', 'Full textbook')}
      ${mat(e.note, '📝', 'Standard note', 'The regular notes')}
      ${mat(e.comp, '📚', 'Comprehensive note', 'Everything in depth')}
      ${e.folder ? `<a class="mat" href="${esc(e.folder)}" target="_blank" rel="noopener"><span class="ic">📂</span><b>Full folder</b><small>All files on Drive ↗</small></a>` : ''}
    </div>
    <div class="acts"><button class="pill" id="ics1">📅 Add to calendar</button><button class="pill" id="share">🔗 Share this page</button></div>

    <div class="syl">
      <div class="syl-h"><h2 class="sm">Syllabus</h2><span class="prog" id="prog"></span></div>
      <div class="bar"><i id="bar"></i></div>
      <p class="hint">Tick chapters as you finish them. Tap a chapter to open its PDF.</p>
      <ul>${e.chapters.map((c, i) => c.sub ? `<li class="divider">${esc(c.sub)}</li>` : `
        <li class="ch"><input type="checkbox" data-i="${i}" aria-label="Mark ${esc(c.name)} as studied">
          <div>${c.url ? `<a class="t" href="${esc(c.url)}" data-pdf>${esc(c.name)}</a>` : `<span class="t">${esc(c.name)}</span>`}
            ${c.book || c.bookUrl || c.cfaUrl ? `<div class="meta">${c.book ? `<span>Book chapter ${esc(c.book)}</span>` : ''}${c.bookUrl ? `<a href="${esc(c.bookUrl)}" data-pdf title="Book chapter ${esc(c.book || c.n)}">Read book chapter</a>` : ''}${c.cfaUrl ? `<a href="${esc(c.cfaUrl)}" data-pdf title="CFA chapter: ${esc(c.name)}">Read CFA chapter</a>` : ''}</div>` : ''}</div></li>`).join('')}</ul>
    </div>

    <div class="pn">
      ${e.prev ? `<a href="#${e.prev.id}"><small>← Previous exam</small><b>${esc(e.prev.name)}</b></a>` : ''}
      ${e.next ? `<a class="r" href="#${e.next.id}"><small>Next exam →</small><b>${esc(e.next.name)}</b></a>` : ''}
    </div>
  </div></section></div>`;
  const saved = new Set(getDone(e));
  const paint = () => { const p = total ? Math.round(saved.size / total * 100) : 0; $('#bar').style.width = p + '%'; $('#prog').textContent = saved.size ? `${saved.size} of ${total} studied` : `${total} chapters`; };
  document.querySelectorAll('.ch input').forEach(cb => {
    cb.checked = saved.has(+cb.dataset.i);
    cb.onchange = () => { cb.checked ? saved.add(+cb.dataset.i) : saved.delete(+cb.dataset.i);
      try { localStorage.setItem(doneKey(e), JSON.stringify([...saved])); } catch {}
      paint();
      if (!cb.checked) return;
      if (saved.size === total) toast('Whole syllabus done. Legend 🏆');
      else if (saved.size === Math.ceil(total / 2)) toast('Halfway there 🎉');
      else if (saved.size === 1) toast('First one down 💪'); };
  });
  paint();
  $('#ics1').onclick = () => ics([e]);
  $('#share').onclick = async () => {
    const url = location.href;
    try { if (navigator.share) await navigator.share({title: e.name, url}); else { await navigator.clipboard.writeText(url); toast('Link copied'); } } catch {}
  };
  if (!e.tba && Date.now() < e.at) startClock(e.at);
}

const mat = (u, ic, label, sub) => u
  ? `<a class="mat" href="${esc(u)}" data-pdf><span class="ic">${ic}</span><b>${label}</b><small>${sub}</small></a>`
  : `<div class="mat off"><span class="ic">${ic}</span><b>${label}</b><small>Not added yet</small></div>`;

// in-page viewer for Drive files and Google Docs; anything else opens in a new tab
function previewUrl(u) {
  const m = u.match(/^https:\/\/(drive|docs)\.google\.com\/(file|document|presentation|spreadsheets)\/d\/([\w-]+)/);
  return m ? `https://${m[1]}.google.com/${m[2]}/d/${m[3]}/preview` : '';
}
document.addEventListener('click', ev => {
  const a = ev.target.closest('a[data-pdf]');
  if (!a || ev.ctrlKey || ev.metaKey || ev.shiftKey) return;
  const src = previewUrl(a.href);
  if (!src) { a.target = '_blank'; a.rel = 'noopener'; return; }
  ev.preventDefault();
  const d = $('#viewer');
  d.querySelector('h3').textContent = a.title || a.textContent.replace(/\s*(PDF|↗)\s*$/, '').trim();
  d.querySelector('iframe').src = src;
  d.querySelector('.open').href = a.href;
  d.showModal();
});

function ics(list) {
  const z = d => d.toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
  list = list.filter(e => !e.tba);
  if (!list.length) return toast('No exam date yet');
  // reminder at 6 pm the evening before (15 h before a 9 am start)
  const ev = list.map(e => `BEGIN:VEVENT\r\nUID:${e.id}@doomsday\r\nDTSTAMP:${z(new Date())}\r\nDTSTART:${z(e.at)}\r\nDTEND:${z(new Date(+e.at + EXAM_LEN * 36e5))}\r\nSUMMARY:Final: ${e.name}\r\nURL:${location.origin}${location.pathname}#${e.id}\r\nBEGIN:VALARM\r\nTRIGGER:-PT15H\r\nACTION:DISPLAY\r\nDESCRIPTION:Exam tomorrow at 9 am\r\nEND:VALARM\r\nEND:VEVENT`).join('\r\n');
  const blob = new Blob([`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Doomsday//EN\r\n${ev}\r\nEND:VCALENDAR`], {type:'text/calendar'});
  const a = Object.assign(document.createElement('a'), {href: URL.createObjectURL(blob), download: list.length > 1 ? 'finals.ics' : `${list[0].id}.ics`});
  a.click(); URL.revokeObjectURL(a.href);
}

function toast(t) { const el = Object.assign(document.createElement('div'), {className:'toast', textContent:t}); document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }

function route() {
  const e = exams.find(x => x.id === location.hash.slice(1));
  e ? detail(e) : home();
  window.scrollTo(0, 0);
}
addEventListener('hashchange', route);

loadSheet().then(r => {
  build(parse(r));
  if (!exams.length) return $('#app').innerHTML = '<div class="wrap sec">The class sheet loaded but no courses were found. Check that the Mid tab still has the "Course" and "Chapter Name" headers.</div>';
  route();
})
  .catch(err => { console.error(err); $('#app').innerHTML = '<div class="wrap sec">Could not load the class sheet. Check your connection and refresh.</div>'; });
</script>
</body>
</html>
